name: Enterprise Security Platform

on:
  workflow_call:
    inputs:
      language:
        description: "Programming language"
        required: true
        type: string

      node-version:
        description: "Node.js version"
        required: false
        default: "22"
        type: string

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: ls -la

      - name: Display Inputs
        run: |
          echo "Language: ${{ inputs.language }}"
          echo "Node Version: ${{ inputs.node-version }}"